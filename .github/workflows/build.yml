name: igxtulGram CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core self-test (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and run self-test
        run: |
          mkdir -p out
          javac -d out $(find core/src/main/java core/src/test/java -name '*.java')
          java -cp out com.igxtul.gram.core.EngineSelfTest

  android:
    name: Android library (AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build AAR
        run: gradle :igxtulgram:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: igxtulgram-aar
          path: android/build/outputs/aar/*.aar
          if-no-files-found: error
